services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_models:/root/.ollama
    # Sin dispositivos GPU ni puertos publicados al host.
  guide-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.rag
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_MIGRATION_URL: postgresql+psycopg://${POSTGRES_MIGRATOR_USER}:${POSTGRES_MIGRATOR_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_LOCAL_PATH: /app/storage
      GUIDE_OLLAMA_URL: http://ollama:11434
      GUIDE_EMBEDDING_PATH: /models/multilingual-e5-small
    volumes:
      - storage:/app/storage
      - ./rag_models:/models:ro
      - ./knowledge:/knowledge:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_started
volumes:
  ollama_models:
