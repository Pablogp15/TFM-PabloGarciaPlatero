server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El backend expone su API bajo /api/v1. Se conserva el prefijo.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El backend limita el archivo a 10 MB. Se deja margen para el
        # envoltorio multipart, que también cuenta en este límite.
        client_max_body_size 12m;
        proxy_read_timeout 120s;
    }

    # SPA: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
